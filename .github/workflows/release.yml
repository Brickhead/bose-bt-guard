# Builds the single-file exe and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v1.2.3
#   git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish BtAudioGuard.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=$version -o out

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/BtAudioGuard.exe diag.ps1 `
            --title "BtAudioGuard ${{ github.ref_name }}" `
            --generate-notes
